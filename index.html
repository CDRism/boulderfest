<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition Category Finder</title>
<style>
  :root {
    --bg: #EDEAE3;
    --surface: #FFFFFF;
    --ink: #221E1B;
    --ink-muted: #6E655C;
    --accent: #24565C;
    --accent-dark: #163539;
    --line: #DBD5CB;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 600px; margin: 0 auto; }

  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  h1 {
    font-size: clamp(28px, 6vw, 38px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 10px;
  }

  .subhead {
    color: var(--ink-muted);
    font-size: 16px;
    line-height: 1.5;
    margin: 0 0 28px;
    max-width: 46ch;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 24px;
  }

  .grade-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
  }

  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
  }

  .swatch {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    border-radius: 60% 40% 55% 45% / 55% 45% 60% 40%;
    border: 2px solid rgba(0,0,0,0.14);
  }

  .swatch-white { border-color: #B0A69A; }

  .color-name {
    flex: 1;
    font-size: 14.5px;
    font-weight: 600;
  }

  .stepper {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }

  .stepper button {
    width: 30px;
    height: 30px;
    border: none;
    background: var(--surface);
    color: var(--accent-dark);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }

  .stepper button:hover { background: var(--bg); }
  .stepper button:active { background: var(--line); }
  .stepper button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .stepper button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stepper button:disabled:hover { background: var(--surface); }

  .stepper .count {
    width: 30px;
    text-align: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 14px;
    font-weight: 600;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  .tally {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .tally-ticks {
    display: flex;
    gap: 4px;
    flex: 1;
  }

  .tick {
    height: 8px;
    flex: 1;
    background: var(--line);
    border-radius: 2px;
    transition: background 0.15s ease;
  }

  .tick.filled { background: var(--accent); }

  .tally-count {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .btn {
    flex: 1;
    padding: 13px 18px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }

  .btn-secondary {
    background: transparent;
    color: var(--ink-muted);
    border: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .btn-secondary:hover { background: var(--bg); }

  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty-note {
    margin: 16px 0 0;
    font-size: 14px;
    color: var(--ink-muted);
    display: none;
  }
  .empty-note.visible { display: block; }

  .result { margin-top: 26px; display: none; }
  .result.visible { display: block; }

  .tag {
    position: relative;
    border-radius: 12px;
    padding: 22px 24px 20px 34px;
    transform: rotate(-1.2deg);
    box-shadow: 0 10px 24px rgba(30, 25, 20, 0.14);
  }

  .tag::before {
    content: "";
    position: absolute;
    top: 16px;
    left: 12px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--surface);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.25);
  }

  .tag-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.75;
    margin: 0 0 4px;
  }

  .tag-category { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }

  .tag-detail {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 12.5px;
    margin: 10px 0 0;
    opacity: 0.85;
  }

  footer { margin-top: 20px; font-size: 12.5px; color: var(--ink-muted); text-align: center; }

  @media (max-width: 480px) {
    .grade-columns { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Boulderfest Sign-Up!</p>
  <h1>Find your category</h1>
  <p class="subhead">Count up your top 10 hardest sends by color in the past month. We'll tell you which division to enter!</p>

  <div class="card">
    <div class="grade-columns">
      <div id="col-easy"></div>
      <div id="col-hard"></div>
    </div>

    <div class="tally">
      <div class="tally-ticks" id="tally-ticks"></div>
      <div class="tally-count" id="tally-count">0 entered</div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="calc-btn">Get My Category</button>
      <button type="button" class="btn btn-secondary" id="reset-btn">Reset</button>
    </div>

    <p class="empty-note" id="empty-note">Enter at least one climb before calculating.</p>

    <div class="result" id="result" aria-live="polite">
      <div class="tag" id="tag">
        <p class="tag-eyebrow">Sign up for</p>
        <p class="tag-category" id="tag-category">—</p>
        <p class="tag-detail" id="tag-detail"></p>
      </div>
    </div>
  </div>

  <footer>Categories: Recreational &middot; Intermediate &middot; Advanced &middot; Open</footer>
</div>

<script>
  /* ============ SETTINGS — edit these to fit your gym ============ */

  // Colors in order from EASIEST to HARDEST.
  const COLORS = [
    { key: 'yellow', label: 'Yellow', hex: '#F0BC1E' },
    { key: 'red',    label: 'Red',    hex: '#D32F3C' },
    { key: 'green',  label: 'Green',  hex: '#2E8B57' },
    { key: 'purple', label: 'Purple', hex: '#8E4FC7' },
    { key: 'orange', label: 'Orange', hex: '#F0791E' },
    { key: 'black',  label: 'Black',  hex: '#1C1B19' },
    { key: 'blue',   label: 'Blue',   hex: '#2461A6' },
    { key: 'pink',   label: 'Pink',   hex: '#E85DA0' },
    { key: 'white',  label: 'White',  hex: '#FFFFFF' },
    { key: 'mint',   label: 'Mint',   hex: '#5FD9AE' },
  ];

  // Each category spans three colors: bottom, middle, and top.
  // "bottom" is just for reference (which colors overlap with the tier
  // below) — only middle and top are used in the qualification math below.
  // Listed EASIEST first; Open is the hardest.
  const CATEGORIES = [
    { name: 'Recreational', bottom: 'yellow', middle: 'red',    top: 'green' },
    { name: 'Intermediate', bottom: 'purple', middle: 'orange', top: 'black' },
    { name: 'Advanced',     bottom: 'black',  middle: 'blue',   top: 'pink'  },
    { name: 'Open',         bottom: 'blue',   middle: 'pink',   top: 'white' },
  ];

  // To qualify for a category: the MIDDLE and TOP colors, combined, add up
  // to at least this many sends...
  const TIER_MIDDLE_MIN = 6;
  // ...plus at least this many of its TOP color on their own...
  const TIER_TOP_MIN = 1;
  // ...OR, with zero of the top color, at least this many of the middle
  // color alone.
  const TIER_MIDDLE_HIGH = 8;

  // Absolute override: this many MINT sends (or more) is an automatic
  // Open, independent of every other rule above — mint doesn't need to
  // fit the bottom/middle/top pattern at all.
  const MINT_AUTO_OPEN = 1;

  // The whole form is framed as "your top 10 hardest sends" — this caps
  // the total entries so someone can't inflate their counts by listing
  // more than that. Entering fewer than this is fine (thresholds above
  // still apply as-is); entering more is blocked in the UI.
  const MAX_TOTAL_CLIMBS = 10;

  const TAG_COLORS = {
    Recreational: { bg: '#EDEAE3', fg: '#221E1B' },
    Intermediate: { bg: '#F0791E', fg: '#221E1B' },
    Advanced:     { bg: '#2461A6', fg: '#FFFFFF' },
    Open:         { bg: '#5FD9AE', fg: '#16332A' },
  };

  /* ============ End of settings ============ */

  const counts = COLORS.map(() => 0);

  function buildRows() {
    const easyCol = document.getElementById('col-easy');
    const hardCol = document.getElementById('col-hard');
    const mid = Math.ceil(COLORS.length / 2);

    COLORS.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'color-row';

      const swatch = document.createElement('span');
      swatch.className = 'swatch' + (c.key === 'white' ? ' swatch-white' : '');
      swatch.style.background = c.hex;

      const name = document.createElement('span');
      name.className = 'color-name';
      name.textContent = c.label;

      const stepper = document.createElement('div');
      stepper.className = 'stepper';

      const minus = document.createElement('button');
      minus.type = 'button';
      minus.textContent = '\u2212';
      minus.setAttribute('aria-label', 'Decrease ' + c.label + ' count');
      minus.addEventListener('click', () => changeCount(i, -1));

      const countEl = document.createElement('span');
      countEl.className = 'count';
      countEl.id = 'count-' + c.key;
      countEl.textContent = '0';

      const plus = document.createElement('button');
      plus.type = 'button';
      plus.textContent = '+';
      plus.setAttribute('aria-label', 'Increase ' + c.label + ' count');
      plus.addEventListener('click', () => changeCount(i, 1));

      stepper.append(minus, countEl, plus);
      row.append(swatch, name, stepper);

      (i < mid ? easyCol : hardCol).appendChild(row);
    });
  }

  function buildTicks() {
    const el = document.getElementById('tally-ticks');
    for (let i = 0; i < MAX_TOTAL_CLIMBS; i++) {
      const t = document.createElement('div');
      t.className = 'tick';
      t.id = 'tick-' + i;
      el.appendChild(t);
    }
  }

  function changeCount(i, delta) {
    const total = counts.reduce((a, b) => a + b, 0);
    if (delta > 0 && total >= MAX_TOTAL_CLIMBS) return;
    counts[i] = Math.max(0, counts[i] + delta);
    document.getElementById('count-' + COLORS[i].key).textContent = counts[i];
    updateTally();
  }

  function updateTally() {
    const total = counts.reduce((a, b) => a + b, 0);
    document.getElementById('tally-count').textContent = total + ' of ' + MAX_TOTAL_CLIMBS + ' entered';
    for (let i = 0; i < MAX_TOTAL_CLIMBS; i++) {
      document.getElementById('tick-' + i).classList.toggle('filled', i < total);
    }
    document.querySelectorAll('.stepper button:last-child').forEach(btn => {
      btn.disabled = total >= MAX_TOTAL_CLIMBS;
    });
    document.getElementById('result').classList.remove('visible');
    document.getElementById('empty-note').classList.remove('visible');
  }

  function colorCount(key) {
    const i = COLORS.findIndex(c => c.key === key);
    return i === -1 ? 0 : counts[i];
  }

  function calculate() {
    const total = counts.reduce((a, b) => a + b, 0);
    const noteEl = document.getElementById('empty-note');
    const resultEl = document.getElementById('result');

    if (total === 0) {
      noteEl.classList.add('visible');
      resultEl.classList.remove('visible');
      return;
    }
    noteEl.classList.remove('visible');

    const mintCount = colorCount('mint');
    let category;

    if (mintCount >= MINT_AUTO_OPEN) {
      category = 'Open';
    } else {
      let matched = null;
      for (let i = CATEGORIES.length - 1; i >= 1; i--) {
        const tier = CATEGORIES[i];
        const middleCount = colorCount(tier.middle);
        const topCount = colorCount(tier.top);
        if ((middleCount + topCount) >= TIER_MIDDLE_MIN && (topCount >= TIER_TOP_MIN || middleCount >= TIER_MIDDLE_HIGH)) {
          matched = tier;
          break;
        }
      }
      category = matched ? matched.name : CATEGORIES[0].name;
    }

    let detail = COLORS
      .map((c, i) => counts[i] > 0 ? counts[i] + ' ' + c.label.toLowerCase() : null)
      .filter(Boolean)
      .join(', ');

    if (total !== 10) {
      detail += ' (based on ' + total + ' climbs entered)';
    }

    document.getElementById('tag-category').innerHTML = '<strong>' + category + '</strong>';
    document.getElementById('tag-detail').textContent = detail;

    const colors = TAG_COLORS[category];
    const tag = document.getElementById('tag');
    tag.style.background = colors.bg;
    tag.style.color = colors.fg;

    resultEl.classList.add('visible');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resultEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
  }

  function resetForm() {
    for (let i = 0; i < counts.length; i++) counts[i] = 0;
    COLORS.forEach(c => { document.getElementById('count-' + c.key).textContent = '0'; });
    updateTally();
  }

  document.getElementById('calc-btn').addEventListener('click', calculate);
  document.getElementById('reset-btn').addEventListener('click', resetForm);

  buildRows();
  buildTicks();
  updateTally();
</script>
</body>
</html>
